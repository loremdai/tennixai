[project]
name = "tennix-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19.2",
  "asyncpg>=0.31.0",
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "pydantic-settings>=2,<3",
  "redis>=8.1.0",
  "sqlalchemy[asyncio]>=2.0.52",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=17.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "llm_live: calls the configured real LLM",
  "provider_live: calls LiveTennisAPI",
  "end_to_end_live: calls both real integrations",
  "infrastructure: requires local Docker PostgreSQL/Redis from compose.yaml",
  "api_tennis_live: calls the real API-Tennis REST API (opt-in)",
  "realtime_live: calls the real API-Tennis WebSocket feed (opt-in)",
]

[tool.uv]
package = false
