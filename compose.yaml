name: tennixai

services:
  postgres:
    image: postgres:16
    container_name: tennix-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: tennix
      POSTGRES_PASSWORD: tennix
      POSTGRES_DB: tennix
    volumes:
      - tennix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennix -d tennix"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    container_name: tennix-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tennix_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  tennix_pgdata:
  tennix_redisdata:
